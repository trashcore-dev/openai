<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trashcore Service</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta name="theme-color" content="#1E90FF">
<style>
body { font-family: Arial,sans-serif; margin:0; padding:0; text-align:center; transition: background 0.5s ease; }
body.logged-in { background:#000; color:white; }
body:not(.logged-in) { background: linear-gradient(135deg, #FF4D4D 0%, #B3B3B3 100%); color:white; }
.hidden { display:none; }
.form-container, .card-container, .card { background:#1E90FF; padding:30px; border-radius:16px; margin:10px auto; max-width:450px; color:white; transition: background 0.3s; }
body.logged-in .card, body.logged-in .card-container { background:#111; }
input, button { width:90%; padding:12px; margin:8px 0; border-radius:8px; border:none; }
button { font-weight:bold; cursor:pointer; transition:0.3s; }
button:hover { opacity:0.9; }
.toggle-form { background:none; color:yellow; border:none; cursor:pointer; text-decoration:underline; }
h1 { color:red; margin-bottom:20px; text-shadow:2px 2px 6px rgba(0,0,0,0.3); }
.logo { width:100px; height:100px; border-radius:50%; margin-bottom:20px; }
.button { display:flex; justify-content:center; align-items:center; gap:10px; width:100%; margin:12px 0; padding:15px; font-size:18px; font-weight:bold; color:white; text-decoration:none; border-radius:12px; background-size:200% 200%; cursor:pointer; }
.telegram { background: linear-gradient(90deg, #00BFFF, #1E90FF); }
.whatsapp { background: linear-gradient(90deg, #32CD32, #00FF7F); }
.logout-btn { background-color:#FF4500; margin-top:15px; }
.logout-btn:hover { background-color:#e03e00; }
.wave-container { position:absolute; bottom:0; left:0; width:100%; height:200px; overflow:hidden; z-index:0; }
body:not(.logged-in) .wave { background: rgba(0,0,0,0.3); }
body:not(.logged-in) .wave.wave2 { opacity:0.15; }
.wave { position:absolute; width:200%; height:200%; border-radius:43%; opacity:0.3; animation:waveMove 8s linear infinite; }
.wave.wave2 { bottom:20px; opacity:0.15; animation-duration:12s; }
@keyframes waveMove { 0% { transform:translateX(0) translateY(0) rotate(0deg); } 50% { transform:translateX(50%) translateY(10px) rotate(3deg); } 100% { transform:translateX(0) translateY(0) rotate(0deg); } }
.menu { position:absolute; top:20px; right:20px; display:inline-block; }
.menu-btn { background:rgba(255,255,255,0.8); border:none; padding:10px 15px; border-radius:50px; font-size:16px; cursor:pointer; display:flex; justify-content:center; align-items:center; gap:5px; }
.menu-btn.open i { transform:rotate(90deg); }
.dropdown { position:absolute; top:55px; right:0; background:#000; color:#fff; border-radius:8px; box-shadow:0 8px 20px rgba(0,0,0,0.5); overflow:hidden; min-width:180px; max-height:0; opacity:0; transform:translateY(-10px); transition:max-height 0.3s, opacity 0.3s, transform 0.3s; z-index:10; }
.dropdown.show { max-height:500px; opacity:1; transform:translateY(0); }
.dropdown a { display:block; padding:12px 15px; text-decoration:none; color:#fff; font-weight:bold; transition: background 0.3s; }
.dropdown a:hover { background:#222; }
.card-row { display:flex; flex-direction:column; gap:20px; position:relative; }
#otpDisplay { font-weight:bold; color:#FFD700; margin:10px 0; cursor:pointer; }
</style>
</head>
<body>

<div class="wave-container">
  <div class="wave wave1"></div>
  <div class="wave wave2"></div>
</div>

<!-- Sign Up Form -->
<div class="form-container" id="signupForm">
  <h1>Sign Up</h1>
  <input type="text" id="signupUsername" placeholder="Username (3-15 chars)">
  <input type="tel" id="signupPhone" placeholder="Phone Number">
  <input type="password" id="signupPassword" placeholder="Password (min 6 chars)">
  <button id="createAccountBtn" style="background:#32CD32; color:white;" onclick="signup()">Create Account</button>
  <div id="otpDisplay" class="hidden"></div>
  <button class="toggle-form" style="background:#FFA500; color:white;" onclick="showLoginForm()">Already have an account? Login</button>
  <div style="margin-top:10px; color:black;">©️ 2025 Trashcore Devs</div>
</div>

<!-- Login Form -->
<div class="form-container hidden" id="loginForm">
  <h1>Login</h1>
  <input type="text" id="loginUsername" placeholder="Username">
  <input type="tel" id="loginPhone" placeholder="Phone Number">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()" style="background:#32CD32; color:white;">Login</button>
  <button class="toggle-form" style="background:#FFA500; color:white;" onclick="showSignupForm()">Don't have an account? Sign Up</button>
</div>

<!-- Hamburger Menu -->
<div class="menu hidden" id="menu">
  <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i> <span>Menu</span></button>
  <div class="dropdown" id="dropdownMenu">
    <a href="https://t.me/trashcoredev">Chat with Owner</a>
    <a href="https://youtube.com/@giddytennor?si=H-fa3xk3pYlTE0os">YouTube Channel</a>
    <a href="https://www.instagram.com/putrazyy_xd_?igsh=YzZ0NDRoaXFxM2Zk">Instagram</a>
    <a href="#" onclick="refreshPage()">Refresh Page</a>
    <a href="#" onclick="exitPage()">Exit Page</a>
  </div>
</div>

<!-- Main Content -->
<div class="card-container hidden" id="mainContent">
  <h1 class="page-title">TRASHCORE SITE</h1>
  <div class="card-row">

    <!-- My Services Card -->
    <div class="card" style="position:relative;">
      <a href="https://t.me/YourBotUsername"><img src="https://files.catbox.moe/7x996w.jpg" alt="Logo" class="logo"></a>
      <h2>MY SERVICES</h2>
      <a href="https://t.me/TrashcoreBot" class="button telegram"><i class="fab fa-telegram-plane"></i> Server 1</a>
      <a href="http://t.me/Traschoreultra_bot" class="button telegram"><i class="fab fa-telegram-plane"></i> Server 2</a>
      <a href="https://t.me/theaccidentallygeniuses" class="button telegram"><i class="fab fa-telegram-plane"></i> Join Telegram group</a>
      <a href="https://whatsapp.com/channel/0029VafrbsKG8l5EFBDDCy41" class="button whatsapp"><i class="fab fa-whatsapp"></i> Join WhatsApp Channel</a>

      <!-- AI Chat Room -->
      <div id="aiChatRoom" style="margin-top:20px; padding:10px; background:#222; border-radius:12px;">
        <h3 style="color:#FFD700;">Ask AI a Question</h3>
        <div id="chatMessagesRoom" style="height:200px; overflow-y:auto; border:1px solid #555; border-radius:8px; padding:5px; background:#111;"></div>
        <input id="chatInputRoom" type="text" placeholder="Type your question..." style="width:100%; padding:8px; margin-top:5px; border-radius:8px; border:none; background:#333; color:white;">
        <button id="sendChatRoom" style="margin-top:5px; width:100%; padding:10px; border:none; border-radius:8px; background:#32CD32; color:white; font-weight:bold;">Send</button>
      </div>

      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

  </div>
</div>

<script>
// Users & Auth
let users = JSON.parse(localStorage.getItem('users')) || [];
if(localStorage.getItem('loggedInUser')) enterApp(localStorage.getItem('loggedInUser'));

function showLoginForm(){
  document.getElementById('signupForm').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
}
function showSignupForm(){
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('signupForm').classList.remove('hidden');
}

function isValidUsername(name){ return /^[a-zA-Z0-9_]{3,15}$/.test(name); }
function isValidPassword(pw){ return pw.length >= 6; }

let currentOTP = "";

function signup(){
  const username=document.getElementById('signupUsername').value.trim();
  const phone=document.getElementById('signupPhone').value.trim();
  const password=document.getElementById('signupPassword').value;

  if(!username||!phone||!password){ alert('Fill all fields'); return; }
  if(!isValidUsername(username)){ alert('Invalid username'); return; }
  if(!isValidPassword(password)){ alert('Password must be at least 6 characters'); return; }
  if(users.find(u=>u.username===username)){ alert('Username already exists'); return; }
  if(users.find(u=>u.phone===phone)){ alert('Phone already used'); return; }

  // Generate OTP
  currentOTP = Math.floor(100000 + Math.random()*900000).toString();
  const otpDisplay = document.getElementById('otpDisplay');
  otpDisplay.textContent = `Your OTP: ${currentOTP} (click to copy)`;
  otpDisplay.classList.remove('hidden');
  otpDisplay.onclick = () => { navigator.clipboard.writeText(currentOTP); alert('OTP copied!'); }

  if(confirm('Enter OTP to verify')) {
    const enteredOTP = prompt('Enter the OTP:');
    if(enteredOTP !== currentOTP){ alert('Invalid OTP'); return; }
  } else return;

  users.push({username,phone,password});
  localStorage.setItem('users', JSON.stringify(users));
  alert('Account created! Please login.');
  showLoginForm();
}

function login(){
  const username=document.getElementById('loginUsername').value.trim();
  const phone=document.getElementById('loginPhone').value.trim();
  const password=document.getElementById('loginPassword').value;
  const user=users.find(u=>u.username===username && u.phone===phone && u.password===password);
  if(user){ localStorage.setItem('loggedInUser', username); enterApp(username); }
  else alert('Invalid credentials.');
}

function enterApp(user){
  document.body.classList.add('logged-in');
  document.getElementById('signupForm').classList.add('hidden');
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('menu').style.display="block";
}

function logout(){
  localStorage.removeItem('loggedInUser');
  document.body.classList.remove('logged-in');
  document.getElementById('mainContent').classList.add('hidden');
  document.getElementById('menu').style.display="none";
  showSignupForm();
}

// Hamburger Menu
const menuBtn=document.getElementById('menuBtn');
const dropdown=document.getElementById('dropdownMenu');
menuBtn.addEventListener('click',()=>{ dropdown.classList.toggle('show'); menuBtn.classList.toggle('open'); });
window.addEventListener('click', e=>{ if(!e.target.matches('.menu-btn')&&!e.target.matches('.menu-btn *')){ dropdown.classList.remove('show'); menuBtn.classList.remove('open'); } });

// Refresh & Exit Functions
function refreshPage() { location.reload(); }
function exitPage() { if (confirm("Are you sure you want to exit?")) { window.open('', '_self'); window.close(); } }

// --- AI Chat Integration ---
const sendChatRoom = document.getElementById('sendChatRoom');
const chatInputRoom = document.getElementById('chatInputRoom');
const chatMessagesRoom = document.getElementById('chatMessagesRoom');

sendChatRoom.addEventListener('click', async () => {
  const msg = chatInputRoom.value.trim();
  if(!msg) return;

  // Show user message
  const userMsg = document.createElement('div');
  userMsg.style.textAlign = 'right';
  userMsg.style.margin = '5px 0';
  userMsg.textContent = "You: " + msg;
  chatMessagesRoom.appendChild(userMsg);

  chatInputRoom.value = '';
  chatMessagesRoom.scrollTop = chatMessagesRoom.scrollHeight;

  // Show AI typing
  const typingMsg = document.createElement('div');
  typingMsg.style.textAlign = 'left';
  typingMsg.style.margin = '5px 0';
  typingMsg.textContent = "AI: ...";
  chatMessagesRoom.appendChild(typingMsg);
  chatMessagesRoom.scrollTop = chatMessagesRoom.scrollHeight;

  try {
    const response = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const data = await response.json();
    typingMsg.textContent = "AI: " + data.reply;
  } catch(err) {
    typingMsg.textContent = "AI: Sorry, something went wrong.";
    console.error(err);
  }

  chatMessagesRoom.scrollTop = chatMessagesRoom.scrollHeight;
});

// Enter key sends message
chatInputRoom.addEventListener('keydown', e => { if(e.key==='Enter') sendChatRoom.click(); });
</script>
</body>
</html>
