<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trashcore Service</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; text-align:center; transition: background 0.5s ease; }
body.logged-in { background:#000; color:white; }
body:not(.logged-in) { background: linear-gradient(135deg, #FF4D4D 0%, #B3B3B3 100%); color:white; }
.hidden { display:none; }
.form-container, .card-container, .card { background:#1E90FF; padding:30px; border-radius:16px; margin:20px auto; max-width:450px; color:white; }
body.logged-in .card, body.logged-in .card-container { background:#111; }
input, button { width:90%; padding:12px; margin:8px 0; border-radius:8px; border:none; }
button { font-weight:bold; cursor:pointer; transition:0.3s; }
button:hover { opacity:0.9; }
h1 { color:red; margin-bottom:20px; }
.logout-btn { background-color:#FF4500; margin-top:15px; }
.logout-btn:hover { background-color:#e03e00; }
.menu { background:#222; padding:12px; display:flex; justify-content:space-around; color:white; }
.menu button { background:none; border:none; color:white; font-size:16px; cursor:pointer; }
</style>
</head>
<body>

<!-- Menu -->


<!-- Sign Up Form -->
<div class="form-container" id="signupForm">
  <h1>Sign Up</h1>
  <input type="text" id="signupUsername" placeholder="Username (3-15 chars)">
  <input type="text" id="signupPhone" placeholder="Phone Number">
  <input type="password" id="signupPassword" placeholder="Password (min 6 chars)">
  <button onclick="signup()" style="background:#32CD32; color:white;">Create Account</button>
  <button onclick="showLoginForm()" style="background:#FFA500; color:white;">Already have an account? Login</button>
</div>

<!-- OTP Verification -->
<div class="form-container hidden" id="otpForm">
  <h1>Verify OTP</h1>
  <p id="otpDisplay" style="font-size:18px; font-weight:bold; background:#fff; color:#000; padding:10px; border-radius:8px; cursor:pointer;" onclick="copyOTP()"></p>
  <input type="text" id="otpInput" placeholder="Enter OTP">
  <button onclick="verifyOTP()" style="background:#32CD32; color:white;">Verify</button>
  <button onclick="resendOTP()" style="background:#FFA500; color:white; margin-top:10px;">Resend OTP</button>
</div>

<!-- Login Form -->
<div class="form-container hidden" id="loginForm">
  <h1>Login</h1>
  <input type="text" id="loginUsername" placeholder="Username">
  <input type="text" id="loginPhone" placeholder="Phone Number">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()" style="background:#32CD32; color:white;">Login</button>
  <button onclick="showSignupForm()" style="background:#FFA500; color:white;">Don't have an account? Sign Up</button>
</div>

<!-- Main Content -->
<div class="card-container hidden" id="mainContent">
  <h1>TRASHCORE SITE</h1>

  <!-- Services Section -->
  <div class="card section" id="servicesSection">
    <h2>MY SERVICES</h2>
    <a href="https://t.me/TrashcoreBot" class="button" style="background:#00BFFF; display:block; margin:10px; padding:12px; color:white; border-radius:8px; text-decoration:none;">Telegram Bot</a>
    <a href="https://whatsapp.com/channel/0029VafrbsKG8l5EFBDDCy41" class="button" style="background:#32CD32; display:block; margin:10px; padding:12px; color:white; border-radius:8px; text-decoration:none;">WhatsApp Channel</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- Music Player -->
  <div class="card section hidden" id="musicSection">
    <h2>Music Player</h2>
    <audio id="musicPlayer" controls>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      Your browser does not support audio.
    </audio>
  </div>

  <!-- AI Chat -->
  <div class="card section hidden" id="chatSection">
    <h2>AI Chat Room</h2>
    <div id="chatMessages" style="height:200px; overflow-y:auto; border:1px solid #333; padding:10px; background:#222; color:white; text-align:left;"></div>
    <input type="text" id="chatInput" placeholder="Ask AI something...">
    <button onclick="sendMessage()" style="background:#FFD700; color:black;">Send</button>
  </div>
</div>

<script>
let users = JSON.parse(localStorage.getItem('users')) || [];
let currentOTP = null;
let deferredPrompt;
if(localStorage.getItem('loggedInUser')) enterApp(localStorage.getItem('loggedInUser'));

function isValidUsername(name){ return /^[a-zA-Z0-9_]{3,15}$/.test(name); }
function isValidPassword(pw){ return pw.length >= 6; }

function showLoginForm(){
  document.getElementById('signupForm').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
}
function showSignupForm(){
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('signupForm').classList.remove('hidden');
}

function signup(){
  const username=document.getElementById('signupUsername').value.trim();
  const phone=document.getElementById('signupPhone').value.trim();
  const password=document.getElementById('signupPassword').value;
  if(!username||!phone||!password){ alert('Fill all fields'); return; }
  if(!isValidUsername(username)){ alert('Invalid username'); return; }
  if(!isValidPassword(password)){ alert('Password too short'); return; }
  if(users.find(u=>u.username===username)){ alert('Username already exists'); return; }
  localStorage.setItem("pendingUser", JSON.stringify({username, phone, password}));
  document.getElementById("signupForm").classList.add("hidden");
  document.getElementById("otpForm").classList.remove("hidden");
  generateOTP();
}

function generateOTP() {
  currentOTP = Math.floor(100000 + Math.random() * 900000).toString();
  document.getElementById("otpDisplay").textContent = "Your OTP: " + currentOTP + " (tap to copy)";
}
function copyOTP() {
  if (!currentOTP) return;
  navigator.clipboard.writeText(currentOTP).then(()=>alert("OTP copied!"));
}
function resendOTP() {
  generateOTP();
  alert("A new OTP has been generated.");
}
function verifyOTP() {
  const entered=document.getElementById("otpInput").value.trim();
  if(entered===currentOTP){
    const pending=JSON.parse(localStorage.getItem("pendingUser"));
    users.push(pending);
    localStorage.setItem("users", JSON.stringify(users));
    localStorage.removeItem("pendingUser");
    alert("OTP verified! You can login now.");
    document.getElementById("otpForm").classList.add("hidden");
    document.getElementById("loginForm").classList.remove("hidden");
  } else { alert("Invalid OTP"); }
}

function login(){
  const username=document.getElementById('loginUsername').value.trim();
  const phone=document.getElementById('loginPhone').value.trim();
  const password=document.getElementById('loginPassword').value;
  const user=users.find(u=>u.username===username && u.phone===phone && u.password===password);
  if(user){ localStorage.setItem('loggedInUser', username); enterApp(username); }
  else alert('Invalid credentials');
}
function enterApp(user){
  document.body.classList.add('logged-in');
  document.getElementById('signupForm').classList.add('hidden');
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('otpForm').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('menuBar').classList.remove('hidden');
  showSection('services');
}
function logout(){
  localStorage.removeItem('loggedInUser');
  document.body.classList.remove('logged-in');
  document.getElementById('mainContent').classList.add('hidden');
  document.getElementById('menuBar').classList.add('hidden');
  showSignupForm();
}

// --- Sections ---
function showSection(section){
  document.querySelectorAll(".section").forEach(s=>s.classList.add("hidden"));
  document.getElementById(section+"Section").classList.remove("hidden");
}

// --- AI Chat Room ---
async function sendMessage(){
  const input=document.getElementById("chatInput");
  const msg=input.value.trim();
  if(!msg) return;
  const chat=document.getElementById("chatMessages");
  chat.innerHTML += `<div style="text-align:right;">You: ${msg}</div>`;
  input.value="";
  try{
    const res=await fetch("/chat",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const data=await res.json();
    chat.innerHTML += `<div style="text-align:left;">AI: ${data.reply}</div>`;
  }catch(err){
    chat.innerHTML += `<div style="text-align:left;">AI: Error connecting.</div>`;
  }
  chat.scrollTop=chat.scrollHeight;
}

// --- PWA Install Prompt ---
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choice) => {
      if(choice.outcome === 'accepted'){ alert("App installed!"); }
      deferredPrompt = null;
    });
  } else { alert("App already installed or not supported."); }
}
</script>
</body>
</html>
