<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trashcore Service</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    header { background: black; color: white; padding: 15px; text-align: center; }
    .container { padding: 20px; }
    .hidden { display: none; }
    button { padding: 8px 14px; margin: 5px; cursor: pointer; }
    input { padding: 8px; margin: 5px; width: 100%; max-width: 300px; }
    .menu { background: #222; color: white; padding: 10px; display: flex; gap: 15px; justify-content: center; }
    .menu button { background: #444; color: white; border: none; border-radius: 5px; }
    #chatBox, #chatMessagesRoom {
      border: 1px solid #ccc; padding: 10px; height: 200px; overflow-y: auto; background: #fff;
    }
    .userMsg { text-align: right; margin: 5px; }
    .botMsg { text-align: left; margin: 5px; }
    #appDownloadPrompt {
      position: fixed; bottom: 20px; left: 20px; background: white; padding: 15px;
      border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Trashcore Service</h1>
  </header>

  <!-- SIGNUP PAGE -->
  <div id="signupPage" class="container">
    <h2>Sign Up</h2>
    <input type="text" id="username" placeholder="Username"><br>
    <input type="tel" id="phone" placeholder="Phone Number"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="signUp()">Sign Up</button>
    <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
    <div id="otpSection" class="hidden">
      <p>Enter OTP sent to your phone:</p>
      <input type="text" id="otpInput" placeholder="Enter OTP"><br>
      <button onclick="verifyOTP()">Verify OTP</button>
      <button onclick="resendOTP()">Resend OTP</button>
      <button onclick="copyOTP()">Copy OTP</button>
      <button onclick="pasteOTP()">Paste OTP</button>
      <p id="otpDisplay"></p>
    </div>
  </div>

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="container hidden">
    <h2>Login</h2>
    <input type="tel" id="loginPhone" placeholder="Phone Number"><br>
    <input type="password" id="loginPassword" placeholder="Password"><br>
    <button onclick="login()">Login</button>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" class="hidden">
    <div class="menu">
      <button onclick="showSection('chatRoom')">AI Chat</button>
      <button onclick="showSection('musicRoom')">Music</button>
    </div>

    <div class="container">
      <!-- AI CHAT ROOM -->
      <div id="chatRoom" class="hidden">
        <h2>AI Chat Room</h2>
        <div id="chatBox"></div>
        <input type="text" id="chatInput" placeholder="Ask something...">
        <button onclick="sendMessage()">Send</button>
      </div>

      <!-- MUSIC ROOM -->
      <div id="musicRoom" class="hidden">
        <h2>Music Search</h2>
        <input type="text" id="musicQuery" placeholder="Enter song name...">
        <button onclick="searchMusic()">Search</button>
        <div id="musicResults"></div>
      </div>
    </div>
  </div>

  <!-- INSTALL APP PROMPT -->
  <div id="appDownloadPrompt">
    <p>Install Trashcore App?</p>
    <button id="downloadAppBtn">Download App</button>
    <button id="dismissAppBtn">Dismiss</button>
  </div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];
let currentUser = null;
let generatedOTP = null;

// ==== AUTH LOGIC ====
function signUp() {
  const username = document.getElementById("username").value;
  const phone = document.getElementById("phone").value;
  const password = document.getElementById("password").value;

  if (!username || !phone || !password) return alert("Fill all fields!");
  if (users.find(u => u.phone === phone)) return alert("Phone already registered!");

  generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
  document.getElementById("otpDisplay").innerText = "Your OTP: " + generatedOTP;
  document.getElementById("otpSection").classList.remove("hidden");

  localStorage.setItem("tempUser", JSON.stringify({ username, phone, password }));
}

function verifyOTP() {
  const otpInput = document.getElementById("otpInput").value;
  if (otpInput === generatedOTP) {
    const tempUser = JSON.parse(localStorage.getItem("tempUser"));
    users.push(tempUser);
    localStorage.setItem("users", JSON.stringify(users));
    alert("Signup successful!");
    showLogin();
  } else {
    alert("Invalid OTP!");
  }
}

function resendOTP() {
  generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
  document.getElementById("otpDisplay").innerText = "Your new OTP: " + generatedOTP;
}

function copyOTP() {
  navigator.clipboard.writeText(generatedOTP);
  alert("OTP copied!");
}

function pasteOTP() {
  navigator.clipboard.readText().then(text => {
    document.getElementById("otpInput").value = text;
  });
}

function showLogin() {
  document.getElementById("signupPage").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
}

function login() {
  const phone = document.getElementById("loginPhone").value;
  const password = document.getElementById("loginPassword").value;
  const user = users.find(u => u.phone === phone && u.password === password);

  if (user) {
    currentUser = user;
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
  } else {
    alert("Invalid login credentials!");
  }
}

// ==== MENU LOGIC ====
function showSection(section) {
  document.getElementById("chatRoom").classList.add("hidden");
  document.getElementById("musicRoom").classList.add("hidden");
  document.getElementById(section).classList.remove("hidden");
}

// ==== AI CHAT (REAL BACKEND CALL) ====
async function sendMessage() {
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (!msg) return;

  const box = document.getElementById("chatBox");
  box.innerHTML += `<div class="userMsg">You: ${msg}</div>`;
  input.value = "";

  try {
    const res = await fetch("/api/chat.js", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });
    const data = await res.json();
    const reply = data.reply || "No response.";
    box.innerHTML += `<div class="botMsg">Bot: ${reply}</div>`;
    box.scrollTop = box.scrollHeight;
  } catch (err) {
    console.error("Chat error:", err);
    box.innerHTML += `<div class="botMsg">Bot: Error connecting to AI.</div>`;
  }
}

// ==== MUSIC SEARCH (YOUTUBE DOWNLOADER API) ====
async function searchMusic() {
  const query = document.getElementById("musicQuery").value.trim();
  if (!query) return alert("Enter a song name!");
  const resultsDiv = document.getElementById("musicResults");
  resultsDiv.innerHTML = "<p>Searching...</p>";

  // Here you would call a real API to search YouTube
  // Example: using izumiiiiiii downloader
  const dummyVideo = {
    title: "Sample Song",
    url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
  };

  resultsDiv.innerHTML = `
    <p>${dummyVideo.title}</p>
    <audio controls src="https://izumiiiiiiii.dpdns.org/downloader/youtube?url=${encodeURIComponent(dummyVideo.url)}&format=mp3"></audio><br>
    <a href="https://izumiiiiiiii.dpdns.org/downloader/youtube?url=${encodeURIComponent(dummyVideo.url)}&format=mp3" download>Download MP3</a>
  `;
}

// ==== INSTALL PROMPT ====
let deferredPrompt;
const appPrompt = document.getElementById("appDownloadPrompt");
const downloadBtn = document.getElementById("downloadAppBtn");
const dismissBtn = document.getElementById("dismissAppBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  appPrompt.style.display = "block";
});

downloadBtn.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome !== "accepted") {
      window.location.href = "/TrashcoreApp.apk"; 
    }
    deferredPrompt = null;
  } else {
    window.location.href = "/TrashcoreApp.apk";
  }
});

dismissBtn.addEventListener("click", () => {
  appPrompt.style.display = "none";
});
</script>
</body>
</html>
